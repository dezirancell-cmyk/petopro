org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- تنظیمات PetroPro (قابل تغییر؛ هیچ آدرسی داخل کد ثابت نشده است) ---
# آدرس سرور داخل برنامه: اگر پر باشد، کادر آدرس در صفحه‌ی ورود نمایش داده نمی‌شود. خالی = کاربر خودش وارد می‌کند.
# (آدرس خودتان را بعد از = بنویسید؛ مثال: https://example.com)
petropro.defaultServerUrl=
# اجازه‌ی HTTP بدون TLS در نسخه‌ی Release. نسخه‌ی Debug همیشه اجازه می‌دهد. برای امنیت توکن، HTTPS توصیه می‌شود.
petropro.allowCleartext=false
